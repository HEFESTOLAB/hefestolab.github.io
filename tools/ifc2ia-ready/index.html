<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07182f">
  <title>HEFESTO IFC2IA Ready · IFC cuantificado para IA</title>
  <meta name="description" content="Herramienta gratuita y local con visor IFC 3D y panel visual de incidencias para auditar, seleccionar y exportar un Excel y JSON cuantificados, trazables y optimizados para presupuestos con IA.">
  <link rel="canonical" href="https://hefestolab.github.io/tools/ifc2ia-ready/">
  <link rel="alternate" hreflang="es" href="https://hefestolab.github.io/tools/ifc2ia-ready/">
  <link rel="alternate" hreflang="x-default" href="https://hefestolab.github.io/tools/ifc2ia-ready/">
  <link rel="icon" href="../../assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/ifc2ia-ready.css?v=1.4.1">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "HEFESTO IFC2IA Ready",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web browser",
    "url": "https://hefestolab.github.io/tools/ifc2ia-ready/",
    "offers": {"@type":"Offer","price":"0","priceCurrency":"EUR"},
    "description": "Auditoría IFC visual con visor 3D interactivo y exportación local de Excel y JSON cuantificados para mediciones y presupuestos asistidos por IA."
  }
  </script>
  <script>(function(){try{var s=localStorage.getItem('hefestolab-theme');document.documentElement.dataset.theme=s||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light')}catch(e){}})();</script>
</head>
<body>
<div class="app-shell" id="app" data-model-loaded="false" data-busy="false">
  <header class="app-topbar">
    <a class="app-brand" href="../../index.html" title="Volver a HEFESTOLAB">
      <img src="../../assets/brand/hefesto-symbol.svg" alt="">
      <span><b>HEFESTOLAB</b><small>IFC2IA READY · TOOLS</small></span>
    </a>
    <span class="top-sep"></span>
    <div class="file-meta">
      <span id="fileName">Proyecto sin cargar</span>
      <small id="fileInfo">IFC → control previo → Excel / JSON para IA</small>
    </div>
    <div class="top-spacer"></div>
    <button class="top-btn" id="btnDemo" type="button" title="Cargar un IFC pequeño de demostración">Demo</button>
    <label class="top-btn primary" for="ifcInput" title="Abrir un archivo IFC desde este dispositivo">Abrir IFC</label>
    <input id="ifcInput" type="file" accept=".ifc,.IFC,.ifczip,.IFCZIP,.zip,application/x-step" hidden>
    <button class="top-btn" id="btnReset" type="button" disabled>Cerrar modelo</button>
    <button class="icon-btn" id="btnTheme" type="button" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
    <a class="icon-btn" href="../index.html" title="Volver a las herramientas" aria-label="Salir">×</a>
  </header>

  <nav class="modebar" aria-label="Fases del trabajo">
    <button class="mode-tab active" data-tab="start" type="button">Inicio</button>
    <button class="mode-tab" data-tab="audit" type="button" disabled>Control previo <span class="badge" id="badgeAudit">0</span></button>
    <button class="mode-tab" data-tab="elements" type="button" disabled>Elementos <span class="badge" id="badgeElements">0</span></button>
    <button class="mode-tab" data-tab="quantities" type="button" disabled>Cantidades <span class="badge" id="badgeQuantities">0</span></button>
    <button class="mode-tab" data-tab="export" type="button" disabled>Exportar</button>
    <span class="spacer"></span>
    <span class="chip privacy-chip"><i></i> 0 datos enviados</span>
    <span class="chip" id="schemaChip">—</span>
    <span class="chip" id="scoreChip">—</span>
  </nav>

  <div class="workspace">
    <aside class="panel-left"><div id="sidePanel"></div></aside>
    <main class="stage" id="stage" tabindex="-1"></main>
  </div>

  <footer class="statusbar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Preparado</span>
    <span class="spacer"></span>
    <span id="statusMeta">Todo se procesa en este navegador</span>
    <span>IFC2IA Ready v1.4.1 · Preview</span>
  </footer>
</div>

<div class="progress hidden" id="progress" role="status" aria-live="polite">
  <div class="progress-card">
    <div class="spinner"></div>
    <b id="progTitle">Analizando IFC</b>
    <p id="progText">Preparando el control previo…</p>
    <div class="progress-bar"><i id="progBar"></i></div>
    <small id="progMeta">El archivo no sale del equipo</small>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="assets/js/step.js?v=1.0.0"></script>
<script src="assets/js/core.js?v=1.4.0"></script>
<script src="assets/vendor/thatopen-components.min.js?v=3.4.8-hefesto1"></script>
<script src="assets/js/viewer.js?v=1.4.6"></script>
<script src="assets/js/app.js?v=1.4.2"></script>
</body>
</html>
